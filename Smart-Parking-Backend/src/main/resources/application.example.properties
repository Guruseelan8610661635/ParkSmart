spring.application.name=Smart-Parking-Backend

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# MYSQL DATABASE (configure locally; do not commit secrets)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking_db
spring.datasource.username=YOUR_DB_USER
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.smartparking=DEBUG
logging.level.org.springframework.web=DEBUG

# ===============================
# EMAIL CONFIGURATION (Optional - for OTP)
# ===============================
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your-email@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# APPLICATION SETTINGS
# ===============================
app.init-sample-data=true

# ===============================
# JWT
# ===============================
# Minimum 32 bytes for HS256
app.jwt.secret=change_me_change_me_change_me_change_me_32B!
app.jwt.expiration-ms=3600000
